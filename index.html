<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>English App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCREEN: HOME -->
  <div id="screen-home" class="screen active">
    <div class="home-header">
      <h1>English App</h1>
      <p class="subtitle">Grammar + Vocabulary</p>
    </div>
    <div class="book-grid">
      <button class="book-card blue" onclick="showBookMenu('blue')">
        <div class="book-icon">📘</div>
        <div class="book-label">Blue Book</div>
        <div class="book-sub">Intermediate · 15 sections</div>
        <div class="book-progress" id="progress-blue">0 / 0 studied</div>
      </button>
      <button class="book-card green" onclick="showBookMenu('green')">
        <div class="book-icon">📗</div>
        <div class="book-label">Green Book</div>
        <div class="book-sub">Advanced · 14 sections</div>
        <div class="book-progress" id="progress-green">0 / 0 studied</div>
      </button>
    </div>
    <div class="vocab-row">
      <button class="book-card vocab" onclick="showBookMenu('vocab')">
        <div class="book-icon">📒</div>
        <div class="book-label">Vocabulary</div>
        <div class="book-sub">Everyday topics · 35 sections · 3518 cards</div>
        <div class="book-progress" id="progress-vocab">0 / 0 studied</div>
      </button>
    </div>
    <div class="due-row">
      <button class="btn-due" id="btn-study-due" onclick="startAllDue()">
        <span id="due-label">Study due cards</span>
        <span class="due-badge" id="due-badge">0</span>
      </button>
    </div>
    <div class="due-row" style="margin-top:10px">
      <button class="btn-due btn-glossary" onclick="showGlossary()">
        <span>📖 Glossary</span>
        <span class="due-badge" id="glossary-known-badge" style="background:#4caf7d">0 known</span>
      </button>
    </div>
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-num" id="stat-streak">0</span>
        <span class="stat-label">day streak</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-label">cards done</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="stat-due">0</span>
        <span class="stat-label">due today</span>
      </div>
    </div>
  </div>

  <!-- SCREEN: BOOK MENU -->
  <div id="screen-book" class="screen">
    <div class="screen-header">
      <button class="btn-back" onclick="showScreen('home')">← Back</button>
      <h2 id="book-menu-title">Sections</h2>
    </div>
    <div id="section-list" class="section-list"></div>
  </div>

  <!-- SCREEN: STUDY -->
  <div id="screen-study" class="screen">
    <div class="screen-header">
      <button class="btn-back" onclick="exitStudy()">← Back</button>
      <div class="study-meta">
        <span id="study-title">Section</span>
        <span id="study-counter">1 / 10</span>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar-fill"></div>
    </div>

    <!-- PHASE 1: question + input -->
    <div id="phase-question" class="phase">
      <div class="card-static">
        <div id="card-front-text" class="card-front-text"></div>
      </div>
      <div class="input-area">
        <input type="text" id="answer-input" class="answer-input"
               placeholder="Type your answer…"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               onkeydown="if(event.key==='Enter') checkAnswer()">
        <button class="btn-check" onclick="checkAnswer()">Check →</button>
      </div>
    </div>

    <!-- PHASE 2: correction -->
    <div id="phase-correction" class="phase hidden">
      <div class="correction-card">
        <div class="correction-question" id="correction-question"></div>
        <div class="correction-divider"></div>
        <div class="correction-your-label">Your answer</div>
        <div class="correction-your" id="correction-your"></div>
        <div class="correction-correct-label">Correct answer</div>
        <div class="correction-correct" id="correction-correct"></div>
        <div class="correction-extra" id="correction-extra"></div>
      </div>
      <button class="btn-flip-back" onclick="showQuestion()">↩ See question again</button>
      <div class="rating-wrap visible">
        <p class="rating-label">How well did you know it?</p>
        <div class="rating-btns">
          <button class="btn-rate again" onclick="rateCard(0)">Again</button>
          <button class="btn-rate hard" onclick="rateCard(1)">Hard</button>
          <button class="btn-rate good" onclick="rateCard(3)">Good</button>
          <button class="btn-rate easy" onclick="rateCard(5)">Easy</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN: SUMMARY -->
  <div id="screen-summary" class="screen">
    <div class="summary-wrap">
      <div class="summary-icon">🎉</div>
      <h2>Session complete!</h2>
      <div class="summary-stats">
        <div class="sum-stat"><span id="sum-easy">0</span><label>Easy</label></div>
        <div class="sum-stat"><span id="sum-good">0</span><label>Good</label></div>
        <div class="sum-stat"><span id="sum-hard">0</span><label>Hard</label></div>
        <div class="sum-stat"><span id="sum-again">0</span><label>Again</label></div>
      </div>
      <button class="btn-primary" onclick="showScreen('home')">Back to Home</button>
      <button class="btn-secondary" id="btn-study-again" onclick="studyAgain()">Study Again</button>
    </div>
  </div>

  <!-- SCREEN: GLOSSARY -->
  <div id="screen-glossary" class="screen">
    <div class="screen-header">
      <button class="btn-back" onclick="showScreen('home')">← Back</button>
      <div class="study-meta">
        <span id="glossary-title">Glossary</span>
        <span id="glossary-counter"></span>
      </div>
    </div>
    <!-- Search + filters -->
    <div class="glossary-toolbar">
      <input type="search" id="glossary-search" class="answer-input glossary-search"
             placeholder="Search…" oninput="renderGlossary()" autocorrect="off" autocapitalize="off">
      <div class="glossary-filters">
        <button class="gfilter active" id="gf-all"     onclick="setGFilter('all')">All</button>
        <button class="gfilter"        id="gf-unknown" onclick="setGFilter('unknown')">To learn</button>
        <button class="gfilter"        id="gf-known"   onclick="setGFilter('known')">Known</button>
      </div>
      <div class="glossary-section-select-wrap">
        <select id="glossary-section-select" class="glossary-section-select" onchange="renderGlossary()">
          <option value="">All sections</option>
        </select>
      </div>
    </div>
    <div id="glossary-list" class="glossary-list"></div>
  </div>

  <!-- NOTE MODAL -->
  <div id="note-modal" class="modal-overlay hidden" onclick="closeNoteModal(event)">
    <div class="modal-box">
      <div class="modal-word" id="modal-word"></div>
      <div class="modal-translation" id="modal-translation"></div>
      <textarea id="modal-textarea" class="modal-textarea" placeholder="Add a mnemonic or note…" rows="4"></textarea>
      <div class="modal-actions">
        <button class="btn-primary" onclick="saveNote()">Save</button>
        <button class="btn-secondary" onclick="closeNoteModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="data/blue.js"></script>
  <script src="data/green.js"></script>
  <script src="data/vocab.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
